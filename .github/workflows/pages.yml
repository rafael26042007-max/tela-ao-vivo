# =====================================================
# Publica a pasta web/ no GitHub Pages a cada push na main
# Endereço: https://rafael26042007-max.github.io/tela-ao-vivo/
# =====================================================
name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Só uma publicação por vez (a mais nova ganha)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---------- 1) Empacota a pasta web/ ----------
  # Separado da publicação (formato oficial do GitHub): com tudo num job só, às vezes
  # a publicação começava antes do pacote ficar registrado e falhava com
  # 'No artifacts named "github-pages" were found'.
  empacotar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      # Troca __VERSAO__ pelo commit nos endereços dos arquivos (ex: app.js?v=3a3f69e).
      # Assim cada versão tem endereços novos e o cache do navegador não mistura versões.
      - name: Marcar a versão nos arquivos
        run: |
          VERSAO="${GITHUB_SHA::7}"
          grep -rl "__VERSAO__" web | xargs sed -i "s/__VERSAO__/${VERSAO}/g"
          echo "Versão publicada: ${VERSAO}"

      - name: Empacotar a pasta web/
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  # ---------- 2) Publica (só depois que o pacote existe) ----------
  publicar:
    needs: empacotar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v5
