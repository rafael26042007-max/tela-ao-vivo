# =====================================================
# Render: servidor de sinalização (plano grátis)
# No painel do Render: New -> Blueprint -> escolha este repositório
# =====================================================
services:
  - type: web
    name: tela-ao-vivo
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /saude
    autoDeploy: true
    # Só reinicia o servidor quando o código DELE mudar.
    # Mudanças no site (web/), README etc. não derrubam ninguém.
    buildFilter:
      paths:
        - server/**
        - package.json
        - package-lock.json
    envVars:
      # Site do GitHub Pages que pode usar este servidor
      - key: ORIGENS_PERMITIDAS
        value: https://rafael26042007-max.github.io
      # O Render fica na frente: o IP do visitante vem no X-Forwarded-For
      - key: CONFIAR_PROXY
        value: "true"
      - key: MAX_PESSOAS
        value: "8"
      - key: MAX_TRANSMISSOES
        value: "4"
      # Chave dos bilhetes: o Render gera uma aleatória uma vez e guarda.
      # É ela que permite recriar as salas depois de uma atualização.
      - key: SEGREDO
        generateValue: true
      # Banco (opcional): DATABASE_URL = connection string do Neon (região São Paulo).
      # Configure no painel do Render, em Environment. Sem ele, o site funciona sem contas.
      # Feedback (opcional): webhook de um canal do Discord. Configure no painel
      # do Render, em Environment: FEEDBACK_WEBHOOK = https://discord.com/api/webhooks/...
      # Sem ele, o botão de feedback não aparece no site.
      # TURN (opcional): configure no painel do Render, em Environment
      #   CLOUDFLARE_TURN_ID e CLOUDFLARE_TURN_TOKEN  (1.000 GB grátis/mês)
      #   ou METERED_CHAVE                            (20 GB grátis/mês)
